<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>farmingviewer.earth — Prueba</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #2e7d32, #a5d6a7);
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(0, 0, 0, 0.25);
      padding: 2rem 3rem;
      border-radius: 16px;
    }
    h1 { margin: 0 0 .5rem; }
    #hora { font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌱 farmingviewer.earth</h1>
    <p>¡Si ves esto, el hosting funciona!</p>
    <p>Hora de tu navegador:</p>
    <p id="hora">--:--:--</p>
  </div>

  <script>
    // Actualiza la hora cada segundo: confirma que el JavaScript también carga
    function tick() {
      document.getElementById("hora").textContent = new Date().toLocaleTimeString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
